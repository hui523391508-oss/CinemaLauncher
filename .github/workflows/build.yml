name: Build CinemaLauncher APKs

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/build.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Generate Android project
        shell: bash
        run: |
          set -e
          mkdir -p app/src/main/java/com/cinema/launcher

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = 'CinemaLauncher'
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.cinema.launcher'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.cinema.launcher'
                  minSdk 26
                  targetSdk 28
                  versionCode 1
                  versionName '1.0'
              }

              flavorDimensions += 'edition'
              productFlavors {
                  testEdition {
                      dimension 'edition'
                      versionCode 1
                      versionName '1.0-test'
                      buildConfigField 'boolean', 'DEFAULT_AUTO_LAUNCH', 'false'
                      buildConfigField 'String', 'EDITION_NAME', '"测试版"'
                  }
                  productionEdition {
                      dimension 'edition'
                      versionCode 2
                      versionName '2.0-final'
                      buildConfigField 'boolean', 'DEFAULT_AUTO_LAUNCH', 'true'
                      buildConfigField 'String', 'EDITION_NAME', '"最终版"'
                  }
              }

              buildTypes {
                  debug {
                      minifyEnabled false
                  }
              }

              buildFeatures {
                  buildConfig true
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.QUERY_ALL_PACKAGES" />
              <uses-feature android:name="android.software.leanback" android:required="false" />

              <application
                  android:allowBackup="false"
                  android:label="私人影院启动器"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTask"
                      android:excludeFromRecents="false">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.HOME" />
                          <category android:name="android.intent.category.DEFAULT" />
                      </intent-filter>

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LEANBACK_LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/cinema/launcher/MainActivity.java <<'EOF'
          package com.cinema.launcher;

          import android.app.Activity;
          import android.content.ComponentName;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.content.pm.PackageManager;
          import android.content.pm.ResolveInfo;
          import android.os.Bundle;
          import android.provider.Settings;
          import android.view.Gravity;
          import android.view.View;
          import android.widget.ArrayAdapter;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.Spinner;
          import android.widget.TextView;
          import android.widget.Toast;

          import java.util.ArrayList;
          import java.util.Collections;
          import java.util.Comparator;
          import java.util.HashSet;
          import java.util.List;
          import java.util.Set;

          public class MainActivity extends Activity {

              private static final String PREFS = "cinema_launcher";
              private static final String KEY_TARGET_PKG = "target_pkg";
              private static final String KEY_TARGET_CLS = "target_cls";
              private static final String KEY_SYSTEM_PKG = "system_pkg";
              private static final String KEY_SYSTEM_CLS = "system_cls";
              private static final String KEY_AUTO = "auto_launch";

              private SharedPreferences prefs;
              private Spinner appSpinner;
              private TextView statusText;
              private final List<AppEntry> apps = new ArrayList<>();

              private boolean targetLaunched = false;
              private boolean pausedAfterTargetLaunch = false;
              private boolean openingSystemHome = false;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  prefs = getSharedPreferences(PREFS, MODE_PRIVATE);

                  if (!prefs.contains(KEY_AUTO)) {
                      prefs.edit().putBoolean(KEY_AUTO, BuildConfig.DEFAULT_AUTO_LAUNCH).apply();
                  }

                  detectAndSaveOriginalHome();
                  buildUi();
                  refreshApps();

                  if (isHomeIntent(getIntent())) {
                      handleHomeRequest();
                  }
              }

              @Override
              protected void onNewIntent(Intent intent) {
                  super.onNewIntent(intent);
                  setIntent(intent);
                  if (isHomeIntent(intent)) {
                      handleHomeRequest();
                  }
              }

              @Override
              protected void onPause() {
                  super.onPause();
                  if (targetLaunched && !openingSystemHome) {
                      pausedAfterTargetLaunch = true;
                  }
              }

              @Override
              protected void onResume() {
                  super.onResume();

                  if (openingSystemHome) {
                      openingSystemHome = false;
                      return;
                  }

                  if (targetLaunched && pausedAfterTargetLaunch) {
                      targetLaunched = false;
                      pausedAfterTargetLaunch = false;
                      openOriginalHome();
                  }

                  updateStatus();
              }

              private boolean isHomeIntent(Intent intent) {
                  return intent != null
                          && Intent.ACTION_MAIN.equals(intent.getAction())
                          && intent.hasCategory(Intent.CATEGORY_HOME);
              }

              private void handleHomeRequest() {
                  pausedAfterTargetLaunch = false;
                  targetLaunched = false;

                  boolean auto = prefs.getBoolean(KEY_AUTO, BuildConfig.DEFAULT_AUTO_LAUNCH);
                  String pkg = prefs.getString(KEY_TARGET_PKG, "");
                  String cls = prefs.getString(KEY_TARGET_CLS, "");

                  if (auto && !pkg.isEmpty() && !cls.isEmpty()) {
                      launchTarget(pkg, cls);
                  }
              }

              private void buildUi() {
                  ScrollView scroll = new ScrollView(this);
                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setPadding(40, 32, 40, 40);
                  root.setGravity(Gravity.CENTER_HORIZONTAL);
                  scroll.addView(root);

                  TextView title = new TextView(this);
                  title.setText("私人影院启动器 · " + BuildConfig.EDITION_NAME);
                  title.setTextSize(26);
                  title.setGravity(Gravity.CENTER);
                  root.addView(title, fullWidth());

                  TextView desc = new TextView(this);
                  desc.setText("\n用途：开机/Home 键进入指定影院软件；影院软件从首页按返回退出后，进入极米原桌面。\n");
                  desc.setTextSize(16);
                  root.addView(desc, fullWidth());

                  appSpinner = new Spinner(this);
                  appSpinner.setFocusable(true);
                  root.addView(appSpinner, fullWidth());

                  Button save = button("保存为影院软件");
                  save.setOnClickListener(v -> saveSelectedTarget());
                  root.addView(save, fullWidth());

                  Button enable = button("开启自动跳转");
                  enable.setOnClickListener(v -> {
                      prefs.edit().putBoolean(KEY_AUTO, true).apply();
                      toast("已开启：开机/Home 将进入影院软件");
                      updateStatus();
                  });
                  root.addView(enable, fullWidth());

                  Button disable = button("关闭自动跳转（安全恢复）");
                  disable.setOnClickListener(v -> {
                      prefs.edit().putBoolean(KEY_AUTO, false).apply();
                      toast("已关闭自动跳转");
                      updateStatus();
                  });
                  root.addView(disable, fullWidth());

                  Button homeSettings = button("设置为默认桌面 / HOME");
                  homeSettings.setOnClickListener(v -> openHomeSettings());
                  root.addView(homeSettings, fullWidth());

                  Button testTarget = button("测试打开影院软件");
                  testTarget.setOnClickListener(v -> launchSavedTarget());
                  root.addView(testTarget, fullWidth());

                  Button systemHome = button("进入极米原桌面");
                  systemHome.setOnClickListener(v -> openOriginalHome());
                  root.addView(systemHome, fullWidth());

                  Button refresh = button("重新扫描应用");
                  refresh.setOnClickListener(v -> refreshApps());
                  root.addView(refresh, fullWidth());

                  statusText = new TextView(this);
                  statusText.setTextSize(15);
                  statusText.setPadding(0, 24, 0, 20);
                  root.addView(statusText, fullWidth());

                  setContentView(scroll);
              }

              private LinearLayout.LayoutParams fullWidth() {
                  LinearLayout.LayoutParams p = new LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT,
                          LinearLayout.LayoutParams.WRAP_CONTENT
                  );
                  p.setMargins(0, 8, 0, 8);
                  return p;
              }

              private Button button(String text) {
                  Button b = new Button(this);
                  b.setText(text);
                  b.setTextSize(17);
                  b.setFocusable(true);
                  return b;
              }

              private void refreshApps() {
                  apps.clear();
                  PackageManager pm = getPackageManager();
                  Set<String> seen = new HashSet<>();

                  collectLaunchables(pm, Intent.CATEGORY_LAUNCHER, seen);
                  collectLaunchables(pm, Intent.CATEGORY_LEANBACK_LAUNCHER, seen);

                  Collections.sort(apps, Comparator.comparing(a -> a.label.toLowerCase()));

                  ArrayAdapter<AppEntry> adapter = new ArrayAdapter<>(
                          this,
                          android.R.layout.simple_spinner_item,
                          apps
                  );
                  adapter.setDropDownViewResource(android.R.layout.simple_spinner_dropdown_item);
                  appSpinner.setAdapter(adapter);

                  String savedPkg = prefs.getString(KEY_TARGET_PKG, "");
                  String savedCls = prefs.getString(KEY_TARGET_CLS, "");
                  for (int i = 0; i < apps.size(); i++) {
                      AppEntry e = apps.get(i);
                      if (e.pkg.equals(savedPkg) && e.cls.equals(savedCls)) {
                          appSpinner.setSelection(i);
                          break;
                      }
                  }
                  updateStatus();
              }

              private void collectLaunchables(PackageManager pm, String category, Set<String> seen) {
                  Intent q = new Intent(Intent.ACTION_MAIN);
                  q.addCategory(category);

                  List<ResolveInfo> list = pm.queryIntentActivities(q, PackageManager.MATCH_ALL);
                  for (ResolveInfo r : list) {
                      if (r.activityInfo == null) continue;
                      String pkg = r.activityInfo.packageName;
                      String cls = r.activityInfo.name;
                      if (getPackageName().equals(pkg)) continue;

                      String key = pkg + "/" + cls;
                      if (!seen.add(key)) continue;

                      CharSequence labelCs = r.loadLabel(pm);
                      String label = labelCs == null ? pkg : labelCs.toString();
                      apps.add(new AppEntry(label, pkg, cls));
                  }
              }

              private void saveSelectedTarget() {
                  Object selected = appSpinner.getSelectedItem();
                  if (!(selected instanceof AppEntry)) {
                      toast("没有可选择的应用");
                      return;
                  }
                  AppEntry e = (AppEntry) selected;
                  prefs.edit()
                          .putString(KEY_TARGET_PKG, e.pkg)
                          .putString(KEY_TARGET_CLS, e.cls)
                          .apply();
                  toast("已保存：" + e.label);
                  updateStatus();
              }

              private void launchSavedTarget() {
                  String pkg = prefs.getString(KEY_TARGET_PKG, "");
                  String cls = prefs.getString(KEY_TARGET_CLS, "");
                  if (pkg.isEmpty() || cls.isEmpty()) {
                      toast("请先选择并保存影院软件");
                      return;
                  }
                  launchTarget(pkg, cls);
              }

              private void launchTarget(String pkg, String cls) {
                  try {
                      Intent launch = new Intent(Intent.ACTION_MAIN);
                      launch.addCategory(Intent.CATEGORY_LAUNCHER);
                      launch.setComponent(new ComponentName(pkg, cls));
                      launch.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_RESET_TASK_IF_NEEDED);
                      targetLaunched = true;
                      pausedAfterTargetLaunch = false;
                      startActivity(launch);
                  } catch (Exception explicitFailure) {
                      try {
                          Intent fallback = getPackageManager().getLaunchIntentForPackage(pkg);
                          if (fallback == null) throw explicitFailure;
                          fallback.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_RESET_TASK_IF_NEEDED);
                          targetLaunched = true;
                          pausedAfterTargetLaunch = false;
                          startActivity(fallback);
                      } catch (Exception e) {
                          targetLaunched = false;
                          pausedAfterTargetLaunch = false;
                          toast("影院软件启动失败：" + e.getMessage());
                      }
                  }
              }

              private void detectAndSaveOriginalHome() {
                  PackageManager pm = getPackageManager();
                  Intent home = new Intent(Intent.ACTION_MAIN);
                  home.addCategory(Intent.CATEGORY_HOME);

                  List<ResolveInfo> homes = pm.queryIntentActivities(home, PackageManager.MATCH_ALL);
                  for (ResolveInfo r : homes) {
                      if (r.activityInfo == null) continue;
                      String pkg = r.activityInfo.packageName;
                      if (getPackageName().equals(pkg)) continue;

                      prefs.edit()
                              .putString(KEY_SYSTEM_PKG, pkg)
                              .putString(KEY_SYSTEM_CLS, r.activityInfo.name)
                              .apply();
                      return;
                  }
              }

              private void openOriginalHome() {
                  String pkg = prefs.getString(KEY_SYSTEM_PKG, "");
                  String cls = prefs.getString(KEY_SYSTEM_CLS, "");

                  if (pkg.isEmpty() || cls.isEmpty()) {
                      detectAndSaveOriginalHome();
                      pkg = prefs.getString(KEY_SYSTEM_PKG, "");
                      cls = prefs.getString(KEY_SYSTEM_CLS, "");
                  }

                  if (pkg.isEmpty() || cls.isEmpty()) {
                      toast("没有找到极米原桌面，请先关闭自动跳转并重新选择默认桌面");
                      openHomeSettings();
                      return;
                  }

                  try {
                      Intent i = new Intent(Intent.ACTION_MAIN);
                      i.addCategory(Intent.CATEGORY_HOME);
                      i.setComponent(new ComponentName(pkg, cls));
                      i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                      openingSystemHome = true;
                      startActivity(i);
                  } catch (Exception e) {
                      openingSystemHome = false;
                      toast("无法打开原桌面：" + e.getMessage());
                      openHomeSettings();
                  }
              }

              private void openHomeSettings() {
                  try {
                      Intent i = new Intent(Settings.ACTION_HOME_SETTINGS);
                      startActivity(i);
                  } catch (Exception e) {
                      try {
                          startActivity(new Intent(Settings.ACTION_SETTINGS));
                      } catch (Exception ignored) {
                          toast("极米系统未开放默认桌面设置入口");
                      }
                  }
              }

              private void updateStatus() {
                  if (statusText == null) return;
                  String pkg = prefs.getString(KEY_TARGET_PKG, "未选择");
                  String sys = prefs.getString(KEY_SYSTEM_PKG, "未识别");
                  boolean auto = prefs.getBoolean(KEY_AUTO, BuildConfig.DEFAULT_AUTO_LAUNCH);

                  statusText.setText(
                          "当前版本：" + BuildConfig.EDITION_NAME
                                  + "\n自动跳转：" + (auto ? "开启" : "关闭")
                                  + "\n影院软件：" + pkg
                                  + "\n原系统桌面：" + sys
                                  + "\n\n测试版建议：先保存影院软件 → 测试打开 → 设置为默认桌面 → 再开启自动跳转。"
                  );
              }

              private void toast(String s) {
                  Toast.makeText(this, s, Toast.LENGTH_LONG).show();
              }

              private static class AppEntry {
                  final String label;
                  final String pkg;
                  final String cls;

                  AppEntry(String label, String pkg, String cls) {
                      this.label = label;
                      this.pkg = pkg;
                      this.cls = cls;
                  }

                  @Override
                  public String toString() {
                      return label + "  (" + pkg + ")";
                  }
              }
          }
          EOF

      - name: Build both APKs
        run: |
          gradle --no-daemon :app:assembleTestEditionDebug :app:assembleProductionEditionDebug

      - name: Prepare output names
        run: |
          mkdir -p out
          cp app/build/outputs/apk/testEdition/debug/app-testEdition-debug.apk out/CinemaLauncher-TEST-v1.apk
          cp app/build/outputs/apk/productionEdition/debug/app-productionEdition-debug.apk out/CinemaLauncher-FINAL-v2.apk
          sha256sum out/*.apk > out/SHA256SUMS.txt

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: CinemaLauncher-APKs
          path: out/*
          retention-days: 30

name: Build Cinema Desktop Assistant V6

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Generate Android project
        shell: bash
        run: |
          set -e
          mkdir -p app/src/main/java/com/privatecinema/desktopassistant
          mkdir -p app/src/main/res/values

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = 'PrivateCinemaDesktopAssistantV6'
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.privatecinema.desktopassistant'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.privatecinema.desktopassistant'
                  minSdk 26
                  targetSdk 28
                  versionCode 10
                  versionName '10.0'
              }

              flavorDimensions += 'edition'
              productFlavors {
                  diagnostic {
                      dimension 'edition'
                      versionCode 10
                      versionName '10.0-v6-test'
                      buildConfigField 'String', 'EDITION_NAME', '"V6测试版"'
                  }
                  production {
                      dimension 'edition'
                      versionCode 11
                      versionName '11.0-v6-final'
                      buildConfigField 'String', 'EDITION_NAME', '"V6最终版"'
                  }
              }

              buildTypes {
                  debug {
                      minifyEnabled false
                  }
              }

              buildFeatures {
                  buildConfig true
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }
          }
          EOF

          cat > app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name">私人影院桌面助手</string>
              <string name="service_channel">私人影院桌面接管</string>
              <string name="service_title">私人影院桌面助手正在运行</string>
              <string name="service_text">负责开机启动、HOME返回和设备诊断</string>
          </resources>
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.SET_WALLPAPER" />
              <uses-permission android:name="android.permission.QUERY_ALL_PACKAGES" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28" />

              <uses-feature android:name="android.software.leanback" android:required="false" />

              <application
                  android:allowBackup="false"
                  android:directBootAware="true"
                  android:label="@string/app_name"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:directBootAware="true"
                      android:exported="true"
                      android:screenOrientation="landscape">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LEANBACK_LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".DesktopMonitorService"
                      android:directBootAware="true"
                      android:enabled="true"
                      android:exported="false" />

                  <receiver
                      android:name=".BootReceiver"
                      android:directBootAware="true"
                      android:enabled="true"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.BOOT_COMPLETED" />
                          <action android:name="android.intent.action.LOCKED_BOOT_COMPLETED" />
                      </intent-filter>
                  </receiver>

              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/privatecinema/desktopassistant/Prefs.java <<'EOF'
          package com.privatecinema.desktopassistant;

          import android.content.Context;
          import android.content.SharedPreferences;

          public final class Prefs {
              private static final String NAME = "private_cinema_desktop_v6";
              private static final String TARGET_PKG = "target_pkg";
              private static final String TARGET_CLS = "target_cls";
              private static final String TARGET_LABEL = "target_label";
              private static final String HOME_ENABLED = "home_enabled";
              private static final String BOOT_ENABLED = "boot_enabled";
              private static final String SERVICE_WANTED = "service_wanted";
              private static final String MAINTENANCE_UNTIL = "maintenance_until";
              private static final String CLOSE_DIALOG_COUNT = "close_dialog_count";
              private static final String HOMEKEY_COUNT = "homekey_count";
              private static final String LAST_REASON = "last_reason";
              private static final String LOCKED_BOOT_COUNT = "locked_boot_count";
              private static final String BOOT_COUNT = "boot_count";
              private static final String SCREEN_ON_COUNT = "screen_on_count";
              private static final String USER_UNLOCKED_COUNT = "user_unlocked_count";
              private static final String LAST_START_SOURCE = "last_start_source";
              private static final String LAUNCH_ATTEMPT_COUNT = "launch_attempt_count";
              private static final String LAUNCH_SUCCESS_COUNT = "launch_success_count";
              private static final String LAUNCH_FAIL_COUNT = "launch_fail_count";
              private static final String LAST_LAUNCH_ERROR = "last_launch_error";
              private static final String LAST_WALLPAPER_STATUS = "last_wallpaper_status";
              private static final String LAST_WALLPAPER_SOURCE = "last_wallpaper_source";
              private Prefs() {}
              private static SharedPreferences p(Context c) {
                  Context storage = c;
                  if (android.os.Build.VERSION.SDK_INT >= android.os.Build.VERSION_CODES.N) {
                      Context dp = c.createDeviceProtectedStorageContext();
                      if (dp != null) storage = dp;
                  }
                  return storage.getSharedPreferences(NAME, Context.MODE_PRIVATE);
              }
              public static void setTarget(Context c, String label, String pkg, String cls) { p(c).edit().putString(TARGET_LABEL, label == null ? "" : label).putString(TARGET_PKG, pkg == null ? "" : pkg).putString(TARGET_CLS, cls == null ? "" : cls).apply(); }
              public static String targetLabel(Context c) { return p(c).getString(TARGET_LABEL, ""); }
              public static String targetPkg(Context c) { return p(c).getString(TARGET_PKG, ""); }
              public static String targetCls(Context c) { return p(c).getString(TARGET_CLS, ""); }
              public static boolean homeEnabled(Context c) { return p(c).getBoolean(HOME_ENABLED, true); }
              public static void setHomeEnabled(Context c, boolean v) { p(c).edit().putBoolean(HOME_ENABLED, v).apply(); }
              public static boolean bootEnabled(Context c) { return p(c).getBoolean(BOOT_ENABLED, true); }
              public static void setBootEnabled(Context c, boolean v) { p(c).edit().putBoolean(BOOT_ENABLED, v).apply(); }
              public static boolean serviceWanted(Context c) { return p(c).getBoolean(SERVICE_WANTED, true); }
              public static void setServiceWanted(Context c, boolean v) { p(c).edit().putBoolean(SERVICE_WANTED, v).apply(); }
              public static void setMaintenanceUntil(Context c, long t) { p(c).edit().putLong(MAINTENANCE_UNTIL, t).apply(); }
              public static long maintenanceUntil(Context c) { return p(c).getLong(MAINTENANCE_UNTIL, 0L); }
              public static void clearMaintenance(Context c) { p(c).edit().putLong(MAINTENANCE_UNTIL, 0L).apply(); }
              public static void receivedCloseDialogs(Context c, String reason) { int n = p(c).getInt(CLOSE_DIALOG_COUNT, 0) + 1; p(c).edit().putInt(CLOSE_DIALOG_COUNT, n).putString(LAST_REASON, reason == null ? "(null)" : reason).apply(); }
              public static void receivedHomeKey(Context c) { int n = p(c).getInt(HOMEKEY_COUNT, 0) + 1; p(c).edit().putInt(HOMEKEY_COUNT, n).apply(); }
              public static void receivedLockedBoot(Context c) { int n = p(c).getInt(LOCKED_BOOT_COUNT, 0) + 1; p(c).edit().putInt(LOCKED_BOOT_COUNT, n).putString(LAST_START_SOURCE, "LOCKED_BOOT_COMPLETED").apply(); }
              public static void receivedBoot(Context c) { int n = p(c).getInt(BOOT_COUNT, 0) + 1; p(c).edit().putInt(BOOT_COUNT, n).putString(LAST_START_SOURCE, "BOOT_COMPLETED").apply(); }
              public static void receivedScreenOn(Context c) { int n = p(c).getInt(SCREEN_ON_COUNT, 0) + 1; p(c).edit().putInt(SCREEN_ON_COUNT, n).putString(LAST_START_SOURCE, "SCREEN_ON").apply(); }
              public static void receivedUserUnlocked(Context c) { int n = p(c).getInt(USER_UNLOCKED_COUNT, 0) + 1; p(c).edit().putInt(USER_UNLOCKED_COUNT, n).putString(LAST_START_SOURCE, "USER_UNLOCKED").apply(); }
              public static void launchAttempt(Context c) { int n = p(c).getInt(LAUNCH_ATTEMPT_COUNT, 0) + 1; p(c).edit().putInt(LAUNCH_ATTEMPT_COUNT, n).apply(); }
              public static void launchSuccess(Context c) { int n = p(c).getInt(LAUNCH_SUCCESS_COUNT, 0) + 1; p(c).edit().putInt(LAUNCH_SUCCESS_COUNT, n).putString(LAST_LAUNCH_ERROR, "无").apply(); }
              public static void launchFailure(Context c, String error) { int n = p(c).getInt(LAUNCH_FAIL_COUNT, 0) + 1; p(c).edit().putInt(LAUNCH_FAIL_COUNT, n).putString(LAST_LAUNCH_ERROR, error == null ? "未知" : error).apply(); }
              public static int closeDialogsCount(Context c) { return p(c).getInt(CLOSE_DIALOG_COUNT, 0); }
              public static int homeKeyCount(Context c) { return p(c).getInt(HOMEKEY_COUNT, 0); }
              public static String lastReason(Context c) { return p(c).getString(LAST_REASON, "尚未收到"); }
              public static int lockedBootCount(Context c) { return p(c).getInt(LOCKED_BOOT_COUNT, 0); }
              public static int bootCount(Context c) { return p(c).getInt(BOOT_COUNT, 0); }
              public static int screenOnCount(Context c) { return p(c).getInt(SCREEN_ON_COUNT, 0); }
              public static int userUnlockedCount(Context c) { return p(c).getInt(USER_UNLOCKED_COUNT, 0); }
              public static String lastStartSource(Context c) { return p(c).getString(LAST_START_SOURCE, "尚未收到"); }
              public static int launchAttemptCount(Context c) { return p(c).getInt(LAUNCH_ATTEMPT_COUNT, 0); }
              public static int launchSuccessCount(Context c) { return p(c).getInt(LAUNCH_SUCCESS_COUNT, 0); }
              public static int launchFailCount(Context c) { return p(c).getInt(LAUNCH_FAIL_COUNT, 0); }
              public static String lastLaunchError(Context c) { return p(c).getString(LAST_LAUNCH_ERROR, "无"); }
              public static void setWallpaperStatus(Context c, String source, String status) { p(c).edit().putString(LAST_WALLPAPER_SOURCE, source == null ? "" : source).putString(LAST_WALLPAPER_STATUS, status == null ? "" : status).apply(); }
              public static String lastWallpaperSource(Context c) { return p(c).getString(LAST_WALLPAPER_SOURCE, "尚未操作"); }
              public static String lastWallpaperStatus(Context c) { return p(c).getString(LAST_WALLPAPER_STATUS, "尚未操作"); }
              public static void resetDiagnostics(Context c) { p(c).edit().putInt(CLOSE_DIALOG_COUNT, 0).putInt(HOMEKEY_COUNT, 0).putString(LAST_REASON, "尚未收到").putInt(LOCKED_BOOT_COUNT, 0).putInt(BOOT_COUNT, 0).putInt(SCREEN_ON_COUNT, 0).putInt(USER_UNLOCKED_COUNT, 0).putString(LAST_START_SOURCE, "尚未收到").putInt(LAUNCH_ATTEMPT_COUNT, 0).putInt(LAUNCH_SUCCESS_COUNT, 0).putInt(LAUNCH_FAIL_COUNT, 0).putString(LAST_LAUNCH_ERROR, "无").apply(); }
          }
          EOF

          cat > app/src/main/java/com/privatecinema/desktopassistant/AppUtils.java <<'EOF'
          package com.privatecinema.desktopassistant;
          import android.content.ComponentName; import android.content.Context; import android.content.Intent; import android.content.pm.PackageManager; import android.content.pm.ResolveInfo; import java.util.ArrayList; import java.util.List;
          public final class AppUtils {
              private AppUtils() {}
              public static boolean launchTarget(Context c) {
                  String pkg = Prefs.targetPkg(c), cls = Prefs.targetCls(c); if (pkg.isEmpty()) { Prefs.launchFailure(c, "未选择目标桌面"); return false; } Prefs.launchAttempt(c);
                  try { if (!cls.isEmpty()) { Intent explicit = new Intent(Intent.ACTION_MAIN); explicit.setComponent(new ComponentName(pkg, cls)); explicit.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_RESET_TASK_IF_NEEDED | Intent.FLAG_ACTIVITY_SINGLE_TOP); c.startActivity(explicit); Prefs.launchSuccess(c); return true; } } catch (Exception ignored) {}
                  try { PackageManager pm = c.getPackageManager(); Intent i = pm.getLeanbackLaunchIntentForPackage(pkg); if (i == null) i = pm.getLaunchIntentForPackage(pkg); if (i == null) throw new IllegalStateException("系统没有返回启动Intent"); i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_RESET_TASK_IF_NEEDED | Intent.FLAG_ACTIVITY_SINGLE_TOP); c.startActivity(i); Prefs.launchSuccess(c); return true; } catch (Exception e) { Prefs.launchFailure(c, e.getClass().getSimpleName() + ": " + String.valueOf(e.getMessage())); return false; }
              }
              public static ComponentName currentDefaultHome(Context c) { try { Intent i = new Intent(Intent.ACTION_MAIN); i.addCategory(Intent.CATEGORY_HOME); ResolveInfo r = c.getPackageManager().resolveActivity(i, PackageManager.MATCH_DEFAULT_ONLY); if (r != null && r.activityInfo != null) return new ComponentName(r.activityInfo.packageName, r.activityInfo.name); } catch (Exception ignored) {} return null; }
              public static List<ComponentName> listHomeActivities(Context c) { List<ComponentName> out = new ArrayList<>(); try { Intent i = new Intent(Intent.ACTION_MAIN); i.addCategory(Intent.CATEGORY_HOME); List<ResolveInfo> list = c.getPackageManager().queryIntentActivities(i, PackageManager.MATCH_ALL); for (ResolveInfo r : list) if (r.activityInfo != null) out.add(new ComponentName(r.activityInfo.packageName, r.activityInfo.name)); } catch (Exception ignored) {} return out; }
              public static String homeCandidates(Context c) { StringBuilder b = new StringBuilder(); for (ComponentName cn : listHomeActivities(c)) { if (b.length() > 0) b.append(" | "); b.append(cn.flattenToShortString()); } return b.length() == 0 ? "未发现" : b.toString(); }
              public static boolean openOriginalHome(Context c) { String targetPkg = Prefs.targetPkg(c); for (ComponentName cn : listHomeActivities(c)) { if (c.getPackageName().equals(cn.getPackageName())) continue; if (!targetPkg.isEmpty() && targetPkg.equals(cn.getPackageName())) continue; try { Intent i = new Intent(Intent.ACTION_MAIN); i.addCategory(Intent.CATEGORY_HOME); i.setComponent(cn); i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_CLEAR_TOP); c.startActivity(i); return true; } catch (Exception ignored) {} } ComponentName current = currentDefaultHome(c); if (current != null) try { Intent i = new Intent(Intent.ACTION_MAIN); i.addCategory(Intent.CATEGORY_HOME); i.setComponent(current); i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_CLEAR_TOP); c.startActivity(i); return true; } catch (Exception ignored) {} return false; }
          }
          EOF

          cat > app/src/main/java/com/privatecinema/desktopassistant/WallpaperUtils.java <<'EOF'
          package com.privatecinema.desktopassistant;
          import android.app.WallpaperManager; import android.content.*; import android.graphics.*; import android.media.MediaScannerConnection; import android.net.Uri; import android.os.*; import android.provider.MediaStore; import java.io.*;
          public final class WallpaperUtils {
              public static final String FOLDER = "私人影院壁纸", BUILTIN_NAME = "私人影院桌面_内置测试壁纸.jpg", CUSTOM_NAME = "私人影院桌面_自定义.jpg"; private static final String INTERNAL_CUSTOM = "custom_wallpaper.jpg"; private WallpaperUtils() {}
              public static Bitmap createBuiltInBitmap() { Bitmap bitmap = Bitmap.createBitmap(1920,1080,Bitmap.Config.ARGB_8888); Canvas c = new Canvas(bitmap); Paint p = new Paint(Paint.ANTI_ALIAS_FLAG); p.setShader(new LinearGradient(0,0,1920,1080,new int[]{Color.rgb(20,28,39),Color.rgb(35,51,66),Color.rgb(46,42,51)},new float[]{0f,.58f,1f},Shader.TileMode.CLAMP)); c.drawRect(0,0,1920,1080,p); Paint glow = new Paint(Paint.ANTI_ALIAS_FLAG); glow.setShader(new RadialGradient(1280,270,850,new int[]{Color.argb(55,122,157,181),Color.argb(0,122,157,181)},new float[]{0f,1f},Shader.TileMode.CLAMP)); c.drawCircle(1280,270,850,glow); Paint bottom = new Paint(Paint.ANTI_ALIAS_FLAG); bottom.setShader(new LinearGradient(0,690,0,1080,new int[]{Color.argb(0,0,0,0),Color.argb(105,0,0,0)},null,Shader.TileMode.CLAMP)); c.drawRect(0,690,1920,1080,bottom); return bitmap; }
              public static boolean hasLegacyStoragePermission(Context c) { if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) return true; return c.checkSelfPermission(android.Manifest.permission.WRITE_EXTERNAL_STORAGE) == android.content.pm.PackageManager.PERMISSION_GRANTED; }
              public static String exportBuiltIn(Context c) { Bitmap b = createBuiltInBitmap(); try { String r = exportBitmap(c,b,BUILTIN_NAME); Prefs.setWallpaperStatus(c,"内置测试壁纸",r); return r; } finally { b.recycle(); } }
              public static String importAndExport(Context c, Uri uri) { Bitmap b = decodeUri(c,uri); if (b == null) { String s="读取自定义图片失败"; Prefs.setWallpaperStatus(c,"自定义壁纸",s); return s; } try { saveInternalCustom(c,b); String r=exportBitmap(c,b,CUSTOM_NAME); Prefs.setWallpaperStatus(c,"自定义壁纸",r); return r; } finally { b.recycle(); } }
              private static String exportBitmap(Context c, Bitmap bitmap, String fileName) { if (Build.VERSION.SDK_INT < Build.VERSION_CODES.Q && !hasLegacyStoragePermission(c)) return "需要先授予存储权限"; try { if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) { Uri p=saveMediaStore(c,bitmap,fileName,MediaStore.Images.Media.EXTERNAL_CONTENT_URI,Environment.DIRECTORY_PICTURES+"/"+FOLDER); Uri d=saveMediaStore(c,bitmap,fileName,MediaStore.Downloads.EXTERNAL_CONTENT_URI,Environment.DIRECTORY_DOWNLOADS+"/"+FOLDER); return "已保存到 Pictures/"+FOLDER+"/ 和 Download/"+FOLDER+"/\nPictures URI="+String.valueOf(p)+"\nDownload URI="+String.valueOf(d); } else { File pics=new File(Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_PICTURES),FOLDER), downs=new File(Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_DOWNLOADS),FOLDER); if(!pics.exists()) pics.mkdirs(); if(!downs.exists()) downs.mkdirs(); File p=new File(pics,fileName), d=new File(downs,fileName); writeJpeg(bitmap,p); writeJpeg(bitmap,d); MediaScannerConnection.scanFile(c,new String[]{p.getAbsolutePath(),d.getAbsolutePath()},new String[]{"image/jpeg","image/jpeg"},null); return "已保存："+p.getAbsolutePath()+"\n并复制到："+d.getAbsolutePath(); } } catch(Exception e){ return "保存失败："+e.getClass().getSimpleName()+": "+String.valueOf(e.getMessage()); } }
              private static Uri saveMediaStore(Context c, Bitmap b, String fileName, Uri collection, String relativePath) throws Exception { ContentResolver cr=c.getContentResolver(); ContentValues cv=new ContentValues(); cv.put(MediaStore.MediaColumns.DISPLAY_NAME,fileName); cv.put(MediaStore.MediaColumns.MIME_TYPE,"image/jpeg"); cv.put(MediaStore.MediaColumns.RELATIVE_PATH,relativePath); cv.put(MediaStore.MediaColumns.IS_PENDING,1); Uri uri=cr.insert(collection,cv); if(uri==null) throw new IllegalStateException("MediaStore insert 返回 null"); try(OutputStream os=cr.openOutputStream(uri,"w")){ if(os==null) throw new IllegalStateException("无法打开输出流"); if(!b.compress(Bitmap.CompressFormat.JPEG,95,os)) throw new IllegalStateException("JPEG写入失败"); } ContentValues done=new ContentValues(); done.put(MediaStore.MediaColumns.IS_PENDING,0); cr.update(uri,done,null,null); return uri; }
              private static void writeJpeg(Bitmap b, File f) throws Exception { try(FileOutputStream fos=new FileOutputStream(f)){ if(!b.compress(Bitmap.CompressFormat.JPEG,95,fos)) throw new IllegalStateException("JPEG写入失败"); } }
              private static void saveInternalCustom(Context c, Bitmap b) { try { writeJpeg(b,new File(c.getFilesDir(),INTERNAL_CUSTOM)); } catch(Exception ignored){} }
              public static boolean hasInternalCustom(Context c) { return new File(c.getFilesDir(),INTERNAL_CUSTOM).exists(); }
              public static String setLatestAsSystemWallpaper(Context c) { Bitmap b=null; String source; try { File custom=new File(c.getFilesDir(),INTERNAL_CUSTOM); if(custom.exists()){ b=BitmapFactory.decodeFile(custom.getAbsolutePath()); source="已导入自定义壁纸"; } else { b=createBuiltInBitmap(); source="内置测试壁纸"; } if(b==null) throw new IllegalStateException("壁纸Bitmap为空"); WallpaperManager.getInstance(c).setBitmap(b,null,true); String s="系统壁纸设置调用成功（当贝是否跟随系统壁纸需实机确认）"; Prefs.setWallpaperStatus(c,source,s); return s; } catch(Exception e){ String s="系统壁纸设置失败："+e.getClass().getSimpleName()+": "+String.valueOf(e.getMessage()); Prefs.setWallpaperStatus(c,"系统壁纸",s); return s; } finally { if(b!=null) b.recycle(); } }
              private static Bitmap decodeUri(Context c, Uri uri) { try { BitmapFactory.Options bounds=new BitmapFactory.Options(); bounds.inJustDecodeBounds=true; try(InputStream in=c.getContentResolver().openInputStream(uri)){ BitmapFactory.decodeStream(in,null,bounds); } int sample=1; while(bounds.outWidth/sample>4096 || bounds.outHeight/sample>4096) sample*=2; BitmapFactory.Options opt=new BitmapFactory.Options(); opt.inSampleSize=sample; opt.inPreferredConfig=Bitmap.Config.ARGB_8888; try(InputStream in=c.getContentResolver().openInputStream(uri)){ return BitmapFactory.decodeStream(in,null,opt); } } catch(Exception e){ return null; } }
          }
          EOF

          cat > app/src/main/java/com/privatecinema/desktopassistant/DesktopMonitorService.java <<'EOF'
          package com.privatecinema.desktopassistant;
          import android.app.*; import android.content.*; import android.os.*;
          public class DesktopMonitorService extends Service {
              public static final String ACTION_START="com.privatecinema.desktopassistant.START_MONITOR", ACTION_STOP="com.privatecinema.desktopassistant.STOP_MONITOR", EXTRA_FROM_BOOT="from_boot"; private static final String CHANNEL="private_cinema_desktop_monitor"; private static final int NOTIFICATION_ID=6101; private static final long HOME_RELAUNCH_DELAY_MS=5300L; private final Handler handler=new Handler(Looper.getMainLooper()); private boolean registered;
              private final BroadcastReceiver systemReceiver=new BroadcastReceiver(){ @Override public void onReceive(Context context,Intent intent){ if(intent==null)return; String action=intent.getAction(); if(Intent.ACTION_SCREEN_ON.equals(action)){ Prefs.receivedScreenOn(context); scheduleWakeLaunch(1800L); return;} if(Intent.ACTION_USER_UNLOCKED.equals(action)){ Prefs.receivedUserUnlocked(context); scheduleWakeLaunch(1200L); return;} if(!Intent.ACTION_CLOSE_SYSTEM_DIALOGS.equals(action))return; String reason=intent.getStringExtra("reason"); Prefs.receivedCloseDialogs(context,reason); if(!"homekey".equals(reason))return; Prefs.receivedHomeKey(context); if(!Prefs.homeEnabled(context)||inMaintenance(context)||Prefs.targetPkg(context).isEmpty())return; handler.removeCallbacks(homeLaunch); handler.postDelayed(homeLaunch,HOME_RELAUNCH_DELAY_MS);} };
              private final Runnable homeLaunch=()->{ if(Prefs.homeEnabled(this)&&!inMaintenance(this)) AppUtils.launchTarget(this); }; private final Runnable wakeLaunch=()->{ if(Prefs.bootEnabled(this)&&!inMaintenance(this)) AppUtils.launchTarget(this); }; private final Runnable bootFallback=()->{ if(Prefs.bootEnabled(this)){ Prefs.clearMaintenance(this); AppUtils.launchTarget(this);} };
              private boolean inMaintenance(Context c){return System.currentTimeMillis()<Prefs.maintenanceUntil(c);} private void scheduleWakeLaunch(long delay){ if(!Prefs.bootEnabled(this)||inMaintenance(this)||Prefs.targetPkg(this).isEmpty())return; handler.removeCallbacks(wakeLaunch); handler.postDelayed(wakeLaunch,delay); }
              @Override public void onCreate(){super.onCreate(); ensureChannel(); startForeground(NOTIFICATION_ID,buildNotification()); registerMonitor();}

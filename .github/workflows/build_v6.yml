      - name: Build V6 APKs
        run: |
          gradle --no-daemon :app:assembleDiagnosticDebug :app:assembleProductionDebug

      - name: Prepare output names
        run: |
          mkdir -p out
          cp app/build/outputs/apk/diagnostic/debug/app-diagnostic-debug.apk out/PrivateCinemaDesktopAssistant-V6-TEST.apk
          cp app/build/outputs/apk/production/debug/app-production-debug.apk out/PrivateCinemaDesktopAssistant-V6-FINAL.apk
          sha256sum out/*.apk > out/SHA256SUMS.txt

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: PrivateCinemaDesktopAssistant-V6-APKs
          path: out/*
          retention-days: 30
